server {
    listen 80;
    listen [::]:80;
    server_name scuolascialtosangro.it www.scuolascialtosangro.it;
    return 301 https://www.scuolascialtosangro.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scuolascialtosangro.it;
    return 301 https://www.scuolascialtosangro.it$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scuolascialtosangro.it;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/redirects.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~* ^/assets/.*\.(?:css|js|woff2?)$ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(?:avif|webp|png|jpe?g|svg|ico)$ { try_files $uri =404; expires 30d; add_header Cache-Control "public"; }
    location = / { try_files /index.html =404; add_header Cache-Control "public, max-age=300"; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location ~ ^/(lezioni|noleggio|chi-siamo|contatti|privacy-policy|cookie-policy)$ { try_files $uri/index.html =404; add_header Cache-Control "public, max-age=300"; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location ~* \.(?:env|log|ini|conf|bak|sql|yml|yaml|toml)$ { deny all; }
}
